services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: hive
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: hive
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hive -d hive"]
      interval: 5s
      timeout: 3s
      retries: 10

  runner:
    profiles: [zimage]
    build:
      context: ./services/runner
    restart: unless-stopped
    environment:
      STARTUP_MODEL_KEY: z-image-turbo
      HF_HOME: /cache/huggingface
      PORT: "8000"
    ports:
      - "127.0.0.1:8188:8000"
    volumes:
      - model_cache:/cache/huggingface
    networks:
      - model_runner_net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30m

volumes:
  postgres_data:
  model_cache:
    name: ${COMPOSE_PROJECT_NAME:-hive}_model_cache

networks:
  model_runner_net:
    driver: bridge
