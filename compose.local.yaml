x-hive-app: &hive-app
  image: ${COMPOSE_PROJECT_NAME:-hive}-local-app
  build:
    context: .
    dockerfile: services/local/Dockerfile
    args:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:3001}

services:
  db:
    ports: !override
      - "127.0.0.1:5432:5432"

  migrate:
    <<: *hive-app
    command: ["npm", "run", "db:migrate", "-w", "@hive/api"]
    environment:
      DATABASE_URL: ${HIVE_LOCAL_DATABASE_URL:?Use npm run local to configure the local database URL}
    depends_on:
      db:
        condition: service_healthy

  api:
    <<: *hive-app
    restart: unless-stopped
    environment:
      DATABASE_URL: ${HIVE_LOCAL_DATABASE_URL:?Use npm run local to configure the local database URL}
      API_PORT: "3001"
      MODEL_RUNNER_URL: http://runner:8000
      RUNNER_API_TOKEN: ${RUNNER_API_TOKEN:?Set RUNNER_API_TOKEN in .env}
      ARTIFACT_ROOT: /app/.data/artifacts
      ARTIFACT_USER_QUOTA_BYTES: ${ARTIFACT_USER_QUOTA_BYTES:-1073741824}
      ARTIFACT_USER_QUOTA_FILES: ${ARTIFACT_USER_QUOTA_FILES:-1000}
      ARTIFACT_TOTAL_QUOTA_BYTES: ${ARTIFACT_TOTAL_QUOTA_BYTES:-10737418240}
      ARTIFACT_TOTAL_QUOTA_FILES: ${ARTIFACT_TOTAL_QUOTA_FILES:-100000}
      GOOGLE_FONTS_CACHE_DIR: /app/.data/google-fonts
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:5173}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://localhost:3001/api/auth/google/callback}
      INSTAGRAM_APP_ID: ${INSTAGRAM_APP_ID:-}
      INSTAGRAM_APP_SECRET: ${INSTAGRAM_APP_SECRET:-}
      INSTAGRAM_REDIRECT_URI: ${INSTAGRAM_REDIRECT_URI:-http://localhost:3001/api/instagram/oauth/callback}
      INSTAGRAM_TOKEN_ENCRYPTION_KEY: ${INSTAGRAM_TOKEN_ENCRYPTION_KEY:-}
      INSTAGRAM_PUBLIC_API_URL: ${INSTAGRAM_PUBLIC_API_URL:-}
      INSTAGRAM_GRAPH_API_VERSION: ${INSTAGRAM_GRAPH_API_VERSION:-v22.0}
      WEBHOOK_SECRET_ENCRYPTION_KEY: ${WEBHOOK_SECRET_ENCRYPTION_KEY:-}
      WEBHOOK_PUBLIC_API_URL: ${WEBHOOK_PUBLIC_API_URL:-}
    ports:
      - "127.0.0.1:3001:3001"
    volumes:
      - ./.data/artifacts:/app/.data/artifacts
      - ./.data/google-fonts:/app/.data/google-fonts
    networks:
      - default
      - model_runner_net
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/health', {signal: AbortSignal.timeout(4000)}).then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 12

  web:
    <<: *hive-app
    restart: unless-stopped
    working_dir: /app/apps/web
    command: ["node", "../../node_modules/vite/bin/vite.js", "preview", "--host", "0.0.0.0", "--port", "5173", "--strictPort"]
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5173', {signal: AbortSignal.timeout(4000)}).then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 12

  worker:
    <<: *hive-app
    restart: unless-stopped
    command: ["node", "apps/api/dist/worker.js"]
    environment:
      DATABASE_URL: ${HIVE_LOCAL_DATABASE_URL:?Use npm run local to configure the local database URL}
      MODEL_RUNNER_URL: http://runner:8000
      RUNNER_API_TOKEN: ${RUNNER_API_TOKEN:?Set RUNNER_API_TOKEN in .env}
      ARTIFACT_ROOT: /app/.data/artifacts
      ARTIFACT_USER_QUOTA_BYTES: ${ARTIFACT_USER_QUOTA_BYTES:-1073741824}
      ARTIFACT_USER_QUOTA_FILES: ${ARTIFACT_USER_QUOTA_FILES:-1000}
      ARTIFACT_TOTAL_QUOTA_BYTES: ${ARTIFACT_TOTAL_QUOTA_BYTES:-10737418240}
      ARTIFACT_TOTAL_QUOTA_FILES: ${ARTIFACT_TOTAL_QUOTA_FILES:-100000}
      GOOGLE_FONTS_CACHE_DIR: /app/.data/google-fonts
      INSTAGRAM_APP_ID: ${INSTAGRAM_APP_ID:-}
      INSTAGRAM_APP_SECRET: ${INSTAGRAM_APP_SECRET:-}
      INSTAGRAM_TOKEN_ENCRYPTION_KEY: ${INSTAGRAM_TOKEN_ENCRYPTION_KEY:-}
      INSTAGRAM_PUBLIC_API_URL: ${INSTAGRAM_PUBLIC_API_URL:-}
      INSTAGRAM_GRAPH_API_VERSION: ${INSTAGRAM_GRAPH_API_VERSION:-v22.0}
    volumes:
      - ./.data/artifacts:/app/.data/artifacts
      - ./.data/google-fonts:/app/.data/google-fonts
    networks:
      - default
      - model_runner_net
    depends_on:
      migrate:
        condition: service_completed_successfully
      runner:
        condition: service_healthy
  cleanup-worker:
    <<: *hive-app
    restart: unless-stopped
    command: ["node", "apps/api/dist/cleanupWorker.js"]
    environment:
      DATABASE_URL: ${HIVE_LOCAL_DATABASE_URL:?Use npm run local to configure the local database URL}
      ARTIFACT_ROOT: /app/.data/artifacts
    volumes:
      - ./.data/artifacts:/app/.data/artifacts
    depends_on:
      migrate:
        condition: service_completed_successfully
